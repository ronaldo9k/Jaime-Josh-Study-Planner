<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>준모의 공부 계획 관리</title>
<style>
:root{--navy:#172a3a;--gold:#e5c477;--paper:#f6f7f9;--ink:#1c2430;--muted:#6d7784;--line:#e4e8ed;--green:#237a55;--red:#b94141;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
header{background:var(--navy);color:#fff;padding:22px 18px 20px;border-radius:0 0 24px 24px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:800}.brand{font-size:23px;font-weight:850;margin:5px 0}.today{font-size:13px;color:#dce3e9}
.iconbtn{background:#2a4051;color:#fff;border-radius:12px;padding:10px 12px}
main{max-width:820px;margin:0 auto;padding:15px 14px 95px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 18px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 9px;text-align:center}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 13px}.tab{padding:9px 12px;border-radius:999px;background:#e8ebef;color:#46515e;font-size:13px;font-weight:700}.tab.active{background:var(--navy);color:white}
.section-title{font-size:18px;font-weight:850;margin:18px 0 10px}.datebar{display:flex;align-items:center;gap:8px;margin:10px 0 14px}.datebar input{flex:1;min-width:0;background:white;border:1px solid var(--line);border-radius:12px;padding:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:9px 0;box-shadow:0 3px 12px #172a3a08}
.cardtop{display:flex;gap:10px;align-items:flex-start}.slot{min-width:62px;max-width:85px;background:#f4e8c9;color:#614c1f;font-size:12px;font-weight:800;padding:8px 6px;text-align:center;border-radius:10px;overflow-wrap:anywhere}
.details{flex:1;min-width:0}.title{font-size:16px;font-weight:800;line-height:1.4;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}.status{display:inline-block;font-size:11px;border-radius:999px;padding:4px 8px;background:#edf0f3;color:#47515c;margin-top:7px}.status.running{background:#dff4e8;color:#17633f}.status.done{background:#e3e9f8;color:#344c87}.status.paused{background:#fff0d7;color:#8a5b13}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.action{flex:1;min-width:95px;padding:10px 9px;border-radius:11px;font-size:13px;font-weight:800;background:#edf0f3;color:#303b47}.action.primary{background:var(--navy);color:white}.action.gold{background:var(--gold);color:#302817}.action.danger{background:#fbe9e9;color:#9b3333}.action:disabled{opacity:.4;cursor:not-allowed}
.progress{height:6px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#d2ad51;width:0}
.fab{position:fixed;bottom:18px;right:max(18px,calc((100vw - 790px)/2));border-radius:999px;background:var(--gold);color:#302817;padding:15px 20px;font-weight:900;box-shadow:0 7px 22px #0002;z-index:4}
.modalback{position:fixed;inset:0;background:#10182088;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}.modalback.show{display:flex}.modal{background:white;width:100%;max-width:650px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 18px}.field{display:block;margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9dfe5;border-radius:12px;background:white}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;gap:8px;margin-top:18px}.modalactions button{flex:1;padding:13px;border-radius:12px;font-weight:800}
.empty{padding:24px 15px;text-align:center;color:var(--muted);background:white;border:1px dashed #d5dbe1;border-radius:16px;font-size:14px}.error{color:var(--red);font-size:13px;white-space:pre-wrap;margin:10px 0}.notice{font-size:12px;color:var(--muted);margin:12px 2px}
@media(min-width:650px){.modalback{align-items:center;padding:20px}.modal{border-radius:24px}.fab{bottom:28px}.card{padding:16px}}
</style>
</head>
<body>
<header>
 <div class="headrow">
  <div><div class="eyebrow">JUNMO'S STUDY</div><div class="brand">오늘의 공부</div><div class="today" id="todayLabel">노션 연결 중…</div></div>
  <button class="iconbtn" onclick="refreshAll()">↻ 새로고침</button>
 </div>
</header>
<main>
 <div class="stats">
  <div class="stat"><strong id="statCount">—</strong><span>표시된 계획</span></div>
  <div class="stat"><strong id="statMinutes">—</strong><span>저장된 공부 시간</span></div>
  <div class="stat"><strong id="statDone">—</strong><span>완료</span></div>
 </div>
 <div class="datebar"><label for="datePick">날짜</label><input id="datePick" type="date"><button class="action" style="flex:0 0 auto" onclick="loadMode(currentMode)">조회</button></div>
 <div class="toolbar" id="tabs">
  <button class="tab active" data-mode="today">오늘 시간표</button>
  <button class="tab" data-mode="carry">이월된 공부</button>
  <button class="tab" data-mode="exam">시험 대비</button>
  <button class="tab" data-mode="future">미래 계획</button>
 </div>
 <div class="section-title" id="listTitle">오늘 시간표</div>
 <div id="cards"><div class="empty">노션 데이터를 불러오고 있어요…</div></div>
 <div class="notice">공부 기록은 노션에 저장됩니다. 네트워크가 끊기면 작업 결과를 확인한 뒤 다시 시도해 주세요.</div>
 <div id="globalError" class="error"></div>

 <div id="globalError" class="error"></div>
</main>
<button class="fab" onclick="openCreate()">＋ 공부 계획</button>

<div class="modalback" id="modalBack" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <h2>새 공부 계획</h2>
  <div class="field"><label for="fTitle">공부 내용</label><input id="fTitle" maxlength="200" placeholder="예: 수학 문제집 3쪽"></div>
  <div class="row2">
   <div class="field"><label for="fDue">목표 완료 날짜</label><input id="fDue" type="date"></div>
   <div class="field"><label for="fMinutes">목표 시간(분)</label><input id="fMinutes" type="number" min="1" max="1440" step="5" value="30"></div>
  </div>
  <div class="field"><label for="fType">계획시점</label><select id="fType" onchange="toggleGoal()"><option>당일계획</option><option>기간계획</option><option>미래계획</option></select></div>
  <div class="field"><label for="fSlot">목표 시간대</label><select id="fSlot"><option value="">시간대 없음 (이월/미배정)</option></select></div>
  <div class="field" id="goalField" style="display:none"><label for="fGoal">상위 목표</label><select id="fGoal"><option value="">목표 선택(선택 사항)</option></select></div>
  <div class="error" id="formError"></div>
  <div class="modalactions"><button style="background:#edf0f3" onclick="closeModal()">취소</button><button style="background:var(--navy);color:white" id="saveBtn" onclick="createPlan()">노션에 저장</button></div>

<script>
/* 배포한 GAS 웹 앱 URL을 여기에 붙여 넣으세요. URL은 /exec 로 끝나야 합니다. */
const GAS_WEB_APP_URL = 'PASTE_YOUR_GAS_WEB_APP_URL_HERE';
let currentMode='today', plans=[], slots=[], goals=[], busy=false;

const $=id=>document.getElementById(id);
function localDate(){
 const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function api(params){
 return new Promise((resolve,reject)=>{
  if(!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('PASTE_YOUR')){
   reject(new Error('index.html 상단의 GAS_WEB_APP_URL에 배포 URL을 입력해 주세요.'));return;
  }
  const callback='gasCallback_'+Math.random().toString(36).slice(2);
  const timer=setTimeout(()=>{cleanup();reject(new Error('서버 응답 시간이 초과됐어요. 연결 상태를 확인해 주세요.'));},30000);
  function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
  window[callback]=data=>{cleanup();if(data&&data.ok)resolve(data);else reject(new Error(data&&data.error||'요청에 실패했어요.'));};
  const script=document.createElement('script');
  script.src=GAS_WEB_APP_URL+'?'+new URLSearchParams({...params,callback}).toString();
  script.onerror=()=>{cleanup();reject(new Error('GAS에 연결할 수 없어요. 배포 권한과 URL을 확인해 주세요.'));};
  document.body.appendChild(script);
 });
}
async function refreshAll(){await loadMode(currentMode);}
async function loadMode(mode){
 currentMode=mode;busy=false;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 const titles={today:'오늘 시간표',carry:'오늘 이월된 공부',exam:'시험 대비 몰아보기',future:'미래 계획 보기'};
 $('listTitle').textContent=titles[mode]||'공부 계획';
 $('cards').innerHTML='<div class="empty">노션 데이터를 불러오고 있어요…</div>';$('globalError').textContent='';
 try{
  const date=$('datePick').value||localDate();
  const res=await api({action:'bootstrap',date,mode});
  slots=res.slots||[];goals=res.goals||[];plans=res.plans||[];
  fillSelects();render();
  $('todayLabel').textContent=`오늘 ${localDate()} · 노션 연결됨`;
 }catch(e){$('cards').innerHTML='<div class="empty">데이터를 불러오지 못했어요.</div>';$('globalError').textContent=e.message;$('todayLabel').textContent='연결 설정 확인 필요';}
}
function fillSelects(){
 const slot=$('fSlot'), old=slot.value;
 slot.innerHTML='<option value="">시간대 없음 (미배정)</option>'+slots.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
 if([...slot.options].some(o=>o.value===old))slot.value=old;
 const goal=$('fGoal'), oldg=goal.value;
 goal.innerHTML='<option value="">목표 선택(선택 사항)</option>'+goals.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}${g.dueDate?' · '+esc(g.dueDate.slice(0,10)):''}</option>`).join('');
 if([...goal.options].some(o=>o.value===oldg))goal.value=oldg;
}
function render(){
 const count=plans.length, done=plans.filter(p=>p.status==='완료').length;
 const mins=plans.reduce((sum,p)=>sum+(Number(p.savedMinutes)||0),0);
 $('statCount').textContent=count;$('statMinutes').textContent=mins+'분';$('statDone').textContent=done;
 if(!plans.length){$('cards').innerHTML='<div class="empty">이 화면에 표시할 공부가 없어요.<br>＋ 공부 계획 버튼으로 새 계획을 만들어 보세요.</div>';return;}
 $('cards').innerHTML=plans.map(p=>{
  const slot=slots.find(s=>s.id===p.slotId);
  const goal=goals.find(g=>g.id===p.goalId);
  const statusClass=p.status==='진행중'?'running':p.status==='완료'?'done':p.status==='일시 중지'?'paused':'';
  const actual=Number(p.savedMinutes)||0, target=Number(p.targetMinutes)||0;
  const pct=target?Math.min(100,Math.round(actual/target*100)):0;
  const isRunning=p.status==='진행중', isDone=p.status==='완료';
  let actions='';
  if(!isDone && !isRunning) actions+=`<button class="action gold" onclick="act('start','${p.id}')">▶ 공부 시작</button>`;
  if(isRunning) actions+=`<button class="action primary" onclick="act('pause','${p.id}')">Ⅱ 일시정지</button><button class="action" onclick="act('stop','${p.id}')">■ 공부 끝</button>`;
  if(!isDone && p.status!=='진행중') actions+=`<button class="action danger" onclick="act('carry','${p.id}')">↻ 내일로 이월</button>`;
  if(modeAllowsSlot() && !isDone) actions+=`<button class="action" onclick="changeSlot('${p.id}')">시간대 변경</button>`;
  return `<article class="card"><div class="cardtop"><div class="slot">${esc(slot?slot.name:(currentMode==='carry'?'이월 공부':'시간대 미정'))}</div><div class="details"><div class="title">${esc(p.title||'(제목 없음)')}</div><div class="meta">목표 ${target}분 · 누적 ${actual}분${p.dueDate?' · 목표일 '+esc(p.dueDate.slice(0,10)):''}${goal?' · '+esc(goal.name):''}${p.carryCount?' · 이월 '+p.carryCount+'회':''}</div><span class="status ${statusClass}">${esc(p.status||'시작전')}${p.timerText?' · '+esc(p.timerText):''}</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="actions">${actions}</div></article>`;
 }).join('');
}
function modeAllowsSlot(){return currentMode==='today'||currentMode==='carry';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function act(action,id){
 if(busy)return;
 const labels={start:'공부를 시작할까요?',pause:'지금까지의 시간을 저장하고 일시정지할까요?',stop:'공부를 끝내고 완료로 표시할까요?',carry:'이 공부를 오늘 할 공부로 이월할까요?'};
 if(!confirm(labels[action]||'실행할까요?'))return;
 busy=true;$('globalError').textContent='';
 try{const r=await api({action,id});alert(r.message||'완료했어요.');await loadMode(currentMode);}

const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwNe0_Q6tk25l9kSHIp8WHV9bebvYDEqK73tJjNGF1dOl4Poe7gcOd3-Oe9YsLgF4q4/exec';

function localDate(){
 const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${day}`;
}
function api(params){
 return new Promise((resolve,reject)=>{
  if(!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('PASTE_YOUR')){
   reject(new Error('index.html 상단의 GAS_WEB_APP_URL에 배포 URL을 입력해 주세요.'));return;
  }
  const callback='gasCallback_'+Math.random().toString(36).slice(2);
  const timer=setTimeout(()=>{cleanup();reject(new Error('서버 응답 시간이 초과됐어요. 연결 상태를 확인해 주세요.'));},30000);
  function cleanup(){clearTimeout(timer);delete window[callback];script.remove();}
  window[callback]=data=>{cleanup();if(data&&data.ok)resolve(data);else reject(new Error(data&&data.error||'요청에 실패했어요.'));};
  const script=document.createElement('script');
  script.src=GAS_WEB_APP_URL+'?'+new URLSearchParams({...params,callback}).toString();
  script.onerror=()=>{cleanup();reject(new Error('GAS에 연결할 수 없어요. 배포 권한과 URL을 확인해 주세요.'));};
  document.body.appendChild(script);
 });
}
async function refreshAll(){await loadMode(currentMode);}

 if([...goal.options].some(o=>o.value===oldg))goal.value=oldg;
}
function render(){
 const count=plans.length, done=plans.filter(p=>p.status==='완료').length;
 const mins=plans.reduce((sum,p)=>sum+(Number(p.savedMinutes)||0),0);
 $('statCount').textContent=count;$('statMinutes').textContent=mins+'분';$('statDone').textContent=done;
 if(!plans.length){$('cards').innerHTML='<div class="empty">이 화면에 표시할 공부가 없어요.<br>＋ 공부 계획 버튼으로 새 계획을 만들어 보세요.</div>';return;}
 $('cards').innerHTML=plans.map(p=>{
  const slot=slots.find(s=>s.id===p.slotId);
  const goal=goals.find(g=>g.id===p.goalId);
  const statusClass=p.status==='진행중'?'running':p.status==='완료'?'done':p.status==='일시 중지'?'paused':'';
  const actual=Number(p.savedMinutes)||0, target=Number(p.targetMinutes)||0;
  const pct=target?Math.min(100,Math.round(actual/target*100)):0;
  const isRunning=p.status==='진행중', isDone=p.status==='완료';
  let actions='';
  if(!isDone && !isRunning) actions+=`<button class="action gold" onclick="act('start','${p.id}')">▶ 공부 시작</button>`;
  if(isRunning) actions+=`<button class="action primary" onclick="act('pause','${p.id}')">Ⅱ 일시정지</button><button class="action" onclick="act('stop','${p.id}')">■ 공부 끝</button>`;
  if(!isDone && p.status!=='진행중') actions+=`<button class="action danger" onclick="act('carry','${p.id}')">↻ 내일로 이월</button>`;
  if(modeAllowsSlot() && !isDone) actions+=`<button class="action" onclick="changeSlot('${p.id}')">시간대 변경</button>`;
  return `<article class="card"><div class="cardtop"><div class="slot">${esc(slot?slot.name:(currentMode==='carry'?'이월 공부':'시간대 미정'))}</div><div class="details"><div class="title">${esc(p.title||'(제목 없음)')}</div><div class="meta">목표 ${target}분 · 누적 ${actual}분${p.dueDate?' · 목표일 '+esc(p.dueDate.slice(0,10)):''}${goal?' · '+esc(goal.name):''}${p.carryCount?' · 이월 '+p.carryCount+'회':''}</div><span class="status ${statusClass}">${esc(p.status||'시작전')}${p.timerText?' · '+esc(p.timerText):''}</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="actions">${actions}</div></article>`;
 }).join('');
}
function modeAllowsSlot(){return currentMode==='today'||currentMode==='carry';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
